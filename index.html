<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>Camions SDC</title>
<meta name="theme-color" content="#F4F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Camions SDC">
<link rel="manifest" href="manifest.webmanifest?v=9">
<link rel="icon" href="favicon-32.png?v=9" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<main id="app">

  <!-- ============ CAMION ============ -->
  <section class="vue active" id="v-camion">
    <header class="top">
      <h1><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14.5" fill="#7A4E27"/><circle cx="16" cy="16" r="12" fill="#E2B877"/><g fill="none" stroke="#B57E43" stroke-width="1.1"><circle cx="16" cy="16" r="9.2"/><circle cx="16" cy="16" r="6.3"/><circle cx="16" cy="16" r="3.4"/></g><circle cx="16" cy="16" r="1.1" fill="#9A6634"/><path d="M16 5.5 17.2 11" stroke="#9A6634" stroke-width="1"/><path d="M26 7c-3 0-5 2-5 5 3 0 5-2 5-5z" fill="#5FA36B"/></svg></span>Camion <span class="badge-sdc">SDC</span></h1>
      <button class="btn-lien" id="btnNouveau" type="button">+ Nouveau</button>
    </header>

    <div class="carte meta">
      <label class="champ"><span>Client</span>
        <input id="client" list="listeClients" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="—" enterkeyhint="next">
      </label>
      <label class="champ ref"><span>Réf. commande</span>
        <input id="reference" inputmode="numeric" autocomplete="off" placeholder="—" enterkeyhint="next">
      </label>
      <datalist id="listeClients"></datalist>
    </div>

    <div class="carte compteur" id="compteur">
      <div class="hero-haut">
        <div class="gros"><span class="lbl" id="lblReste">Reste</span><b id="reste">41,00</b><span class="unite">m³</span></div>
        <div class="total"><b id="total">0,00</b> / <span id="totMax">41</span> m³</div>
      </div>
      <div class="scene">
        <div id="heroCamion"></div>
        <div class="msg" id="msgEtat">Camion vide : ajoute les colis</div>
        <div class="pluie" id="pluie" aria-hidden="true"></div>
      </div>
    </div>

    <form class="carte saisie" id="formLigne" autocomplete="off" novalidate>
      <div class="grille4">
        <label class="champ"><span>Épaiss. mm</span><input id="fEp" inputmode="decimal" enterkeyhint="next"></label>
        <label class="champ"><span>Largeur mm</span><input id="fLa" inputmode="decimal" enterkeyhint="next"></label>
        <label class="champ"><span>Pièces</span><input id="fPi" inputmode="numeric" enterkeyhint="next"></label>
        <label class="champ"><span>Long. m</span><input id="fLo" inputmode="decimal" enterkeyhint="done"></label>
      </div>
      <div class="apercu" id="apercu">Ce colis : <b>—</b> m³</div>
      <div class="ligne-btns">
        <div class="stepper" title="Nombre de colis identiques">
          <button type="button" id="nbMoins" aria-label="Moins">−</button>
          <span><b id="nbVal">1</b><small>colis</small></span>
          <button type="button" id="nbPlus" aria-label="Plus">+</button>
        </div>
        <button type="button" class="btn sec" id="btnMeme">Même section</button>
        <button type="submit" class="btn" id="btnAjouter">Ajouter</button>
      </div>
      <button type="button" class="btn-lien annuler-edit" id="btnAnnulerEdit" hidden>Annuler la modification</button>
    </form>

    <div class="carte liste" id="liste"></div>

    <div class="actions">
      <button class="btn sec" id="btnPlan" type="button">Voir le plan</button>
      <button class="btn" id="btnTerminer" type="button">Terminer ✓</button>
    </div>
  </section>

  <!-- ============ PLAN ============ -->
  <section class="vue" id="v-plan">
    <header class="top">
      <button class="btn-lien" id="btnRetour" type="button">‹ Camion</button>
      <h1 class="petit">Chargement</h1>
      <button class="btn-lien" id="btnPartager" type="button">Partager</button>
    </header>
    <div id="planZone"></div>
    <div class="actions">
      <button class="btn" id="btnRecalc" type="button">Proposer un plan</button>
    </div>
    <div id="attenteZone"></div>
  </section>

  <!-- ============ HISTORIQUE ============ -->
  <section class="vue" id="v-historique">
    <header class="top"><h1>Historique</h1></header>
    <div class="recherche"><input id="recherche" type="search" placeholder="Rechercher client ou référence" autocomplete="off"></div>
    <div id="histo"></div>
  </section>

  <!-- ============ RÉGLAGES ============ -->
  <section class="vue" id="v-reglages">
    <header class="top"><h1>Réglages</h1></header>
    <div id="reglagesZone"></div>
  </section>

</main>

<nav class="barre" id="barre">
  <button class="onglet actif" data-vue="camion" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><path d="M2 6.5h11v9H2zM13 9.5h4.2l3.3 3.4v2.6H13z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></span>
    <span>Camion</span>
  </button>
  <button class="onglet" data-vue="historique" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
    <span>Historique</span>
  </button>
  <button class="onglet" data-vue="reglages" type="button">
    <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
    <span>Réglages</span>
  </button>
</nav>

<div class="feuille-fond" id="feuilleFond" hidden></div>
<div class="feuille" id="feuille" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="plan.js?v=9"></script>
<script src="sync.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
